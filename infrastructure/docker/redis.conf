# Redis Configuration for SalvoStream - Stage 1 Scaffold

# Network options
bind 0.0.0.0
port 6379
protected-mode no

# Connection limit
maxclients 10000

# Memory management
# Max memory limit set to 256mb, which is more than enough for Stage 1 scaffold
maxmemory 268435456
maxmemory-policy allkeys-lru

# Persistence settings (RDB only for basic cache/session saving)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""
